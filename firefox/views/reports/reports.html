<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishTackle — Domain Reports</title>
  <link rel="stylesheet" href="reports.css">
</head>
<body>
  <div class="reports-layout">
    <aside class="reports-sidebar">
      <div class="sidebar-header">
        <svg class="sidebar-header__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 4H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zM16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Reports Navigation</span>
      </div>
      <div id="sidebar-nav" class="sidebar-dates">
        <button class="sidebar-date-btn active" id="tab-btn-queue" data-tab="queue">
          <span class="sidebar-date-btn__label">Current Queue</span>
          <span class="sidebar-date-btn__count" id="count-queue">0</span>
        </button>

        <button class="sidebar-date-btn" id="tab-btn-archive" data-tab="archive">
          <span class="sidebar-date-btn__label">Archive</span>
          <span class="sidebar-date-btn__count" id="count-archive">0</span>
        </button>
      </div>
    </aside>

    <main class="reports-main">
      <header class="reports-header">
        <div class="reports-header__brand">
          <svg class="reports-header__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V7l-9-5zm0 4a3 3 0 013 3c0 1.66-1.34 3-3 3s-3-1.34-3-3a3 3 0 013-3zm0 14.3c-2.5-1-4.71-3.13-5.63-5.8.68-.45 2.51-1.5 5.63-1.5 3.12 0 4.95 1.05 5.63 1.5-.92 2.67-3.13 4.8-5.63 5.8z" fill="currentColor"/>
          </svg>
          <div>
            <h1 class="reports-header__title" id="reports-title">Current Queue</h1>
            <p class="reports-header__subtitle" id="reports-subtitle">Active domain reports queue</p>
          </div>
        </div>

        <div class="header-global-actions" id="header-global-actions">
          <button id="btn-copy-domains" class="reports-btn reports-btn--primary">
            <svg viewBox="0 0 24 24" fill="none" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
              <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Copy Domains
          </button>

          <button id="btn-copy-ips" class="reports-btn reports-btn--secondary">
            <svg viewBox="0 0 24 24" fill="none" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Copy IPs
          </button>

          <button id="btn-archive-all" class="reports-btn reports-btn--accent">
            <svg viewBox="0 0 24 24" fill="none" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 8v11a2 2 0 01-2 2H5a2 2 0 01-2-2V8M23 3H1v5h22V3zM10 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Archive Queue
          </button>

          <button id="btn-clear-queue" class="reports-btn reports-btn--danger">
            <svg viewBox="0 0 24 24" fill="none" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
              <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Clear
          </button>
        </div>
      </header>

      <div class="add-domain-card" id="add-domain-card">
        <div class="add-domain-card__label">Add domain manually</div>
        <div class="add-domain-row">
          <input
            type="text"
            id="add-domain-input"
            class="add-domain-input"
            placeholder="https://example.com or example.com"
            spellcheck="false"
            autocomplete="off"
          />
          <select id="add-domain-category" class="add-domain-select"></select>
          <button id="add-domain-btn" class="add-domain-btn">Add</button>
        </div>
        <div id="add-domain-feedback" class="add-domain-feedback" hidden></div>
      </div>

      <div id="action-feedback" class="reports-feedback" hidden></div>

      <div id="content-container" class="categories-container">
        <div class="loading-state">Loading reports...</div>
      </div>
    </main>
  </div>

  <script src="reports.js" type="module"></script>
</body>
</html>
