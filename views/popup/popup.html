<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRA Phishing Catcher</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="header">
    <div class="header__brand">
      <svg class="header__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V7l-9-5zm0 4a3 3 0 013 3c0 1.66-1.34 3-3 3s-3-1.34-3-3a3 3 0 013-3zm0 14.3c-2.5-1-4.71-3.13-5.63-5.8.68-.45 2.51-1.5 5.63-1.5 3.12 0 4.95 1.05 5.63 1.5-.92 2.67-3.13 4.8-5.63 5.8z"
          fill="currentColor" />
      </svg>
      <h1 class="header__title">ULTRA Phish Catcher</h1>
    </div>
    <div class="header__actions">
      <button id="btn-reports" class="header__settings" title="Domain Reports">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
          <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <button id="btn-settings" class="header__settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <section class="section">
    <div class="section__label">Current Domain Status</div>
    <div id="status-card-container">
      <div class="status-card">
        <div class="status-card__loading">
          <div class="spinner"></div>
          <span>Checking...</span>
        </div>
      </div>
    </div>

    <div class="report-action-row" id="report-action-row" hidden>
      <select id="report-category-select" class="report-select" disabled></select>
      <button id="btn-add-report" class="btn-report-add" disabled>
        <span>➕ Add to List</span>
      </button>
    </div>
  </section>

  <section class="section">
    <div class="section__label">Check Any Domain</div>
    <div class="manual-check__input-row">
      <input type="text" id="manual-check-input" class="manual-check__input"
        placeholder="e.g. example.com or full URL..." spellcheck="false" autocomplete="off" />
      <button id="btn-manual-check" class="manual-check__btn">Check</button>
    </div>

    <div id="manual-check-result" class="manual-check__result"></div>

    <div class="manual-add-row" id="manual-add-row" hidden>
      <select id="manual-add-category" class="report-select"></select>
      <button id="btn-manual-add" class="btn-report-add">
        <span>➕ Add to List</span>
      </button>
    </div>
    <div id="manual-add-feedback" class="manual-add-feedback" hidden></div>
  </section>

  <section class="section section--future" id="future-modules">
    <!-- Future modules placeholder -->
  </section>

  <footer class="footer">
    <div class="footer__info">
      <span id="footer-count" class="footer__stat">—</span>
      <span class="footer__sep">·</span>
      <span id="footer-updated" class="footer__stat">—</span>
    </div>
    <button id="btn-refresh" class="footer__refresh" title="Refresh domain list">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
        <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </footer>

  <script src="popup.js" type="module"></script>
</body>

</html>
